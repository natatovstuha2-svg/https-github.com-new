<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Студія декоративного тексту — Н. С. Товстуха</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    font-family:"Segoe UI",Arial,sans-serif;
    background:#eaf4fb;
    color:#10243a;
    overflow:hidden;
}


/* =========================================================
   ШАПКА-ПЛАШКА
========================================================= */

.site-header{
    height:118px;
    position:relative;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:14px 32px 14px 38px;

    background:
        radial-gradient(
            circle at 70% 40%,
            rgba(26,91,139,.22),
            transparent 34%
        ),
        linear-gradient(
            100deg,
            #061d34 0%,
            #082d4d 48%,
            #0b446d 100%
        );

    border-bottom:2px solid #c99437;

    box-shadow:
        0 8px 24px
        rgba(4,34,59,.18);

    overflow:hidden;

    z-index:10;
}


/* тонкий золотий акцент */

.site-header::after{
    content:"";

    position:absolute;

    left:35px;
    right:35px;
    bottom:8px;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(235,196,102,.30),
            rgba(244,213,133,.78),
            rgba(235,196,102,.30),
            transparent
        );
}


/* =========================================================
   ТЕКСТ ШАПКИ
========================================================= */

.header-copy{
    position:relative;
    z-index:3;

    min-width:0;
}

.kicker{
    margin-bottom:3px;

    color:
        rgba(232,243,251,.82);

    font-size:10px;

    letter-spacing:.17em;

    text-transform:uppercase;
}


.site-title{
    margin:0;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(27px,2.65vw,43px);

    font-weight:700;

    line-height:1;

    letter-spacing:.005em;

    background:
        linear-gradient(
            180deg,
            #fff2bf 0%,
            #f0cf78 28%,
            #d09b3a 55%,
            #a96e1d 72%,
            #f4d988 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    filter:
        drop-shadow(
            0 2px 2px
            rgba(0,0,0,.28)
        );
}


/* =========================================================
   АВТОРСЬКИЙ ПІДПИС
========================================================= */

.author-row{
    display:flex;
    align-items:center;

    gap:8px;

    margin-top:6px;
}

.author-label{
    color:
        rgba(255,255,255,.62);

    font-size:10px;
}


.author-signature{
    display:inline-block;

    font-family:
        "Segoe Print",
        "Bradley Hand",
        "Comic Sans MS",
        cursive;

    font-size:24px;

    font-weight:600;

    line-height:1;

    letter-spacing:-1.4px;

    transform:
        skew(-7deg)
        scaleX(.88);

    transform-origin:left center;

    background:
        linear-gradient(
            105deg,
            #a86d1c 0%,
            #dba744 20%,
            #ffe8a3 38%,
            #fff4c7 46%,
            #d89c32 58%,
            #f1cc6d 78%,
            #a76a19 100%
        );

    background-size:
        260% 100%;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    filter:
        drop-shadow(
            0 1px 0
            rgba(255,240,178,.32)
        )
        drop-shadow(
            0 3px 2px
            rgba(0,0,0,.26)
        );

    animation:
        signatureShine 7.5s
        ease-in-out
        infinite;
}


/* повільний делікатний перелив */

@keyframes signatureShine{

    0%{
        background-position:110% 50%;
    }

    38%{
        background-position:110% 50%;
    }

    56%{
        background-position:-20% 50%;
    }

    100%{
        background-position:-20% 50%;
    }
}


/* =========================================================
   ПРАВА ЧАСТИНА ШАПКИ
========================================================= */

.header-visual{
    position:relative;

    flex:0 0 auto;

    width:380px;
    height:100px;

    z-index:2;
}


/* Справжні книги.
   Коли teacher-books.png з'явиться в GitHub,
   картинка підтягнеться автоматично.
*/

.books-image{
    position:absolute;

    right:4px;
    bottom:-23px;

    width:250px;
    height:auto;

    object-fit:contain;

    filter:
        drop-shadow(
            0 9px 12px
            rgba(0,0,0,.23)
        );

    pointer-events:none;
}


/* =========================================================
   ПРЕМІАЛЬНА РУЧКА
========================================================= */

.pen{
    position:absolute;

    right:164px;
    top:29px;

    width:205px;
    height:14px;

    border-radius:10px;

    transform:
        rotate(-8deg);

    background:
        linear-gradient(
            180deg,
            #02070b 0%,
            #193c58 22%,
            #071927 58%,
            #020609 100%
        );

    border:
        1px solid #c99736;

    box-shadow:
        0 7px 12px
        rgba(0,0,0,.28),
        inset 0 1px 2px
        rgba(255,255,255,.28);

    animation:
        penFloat 6s
        ease-in-out
        infinite;
}


/* золотий наконечник */

.pen::before{
    content:"";

    position:absolute;

    right:-41px;
    top:-1px;

    width:48px;
    height:14px;

    clip-path:
        polygon(
            0 0,
            100% 50%,
            0 100%
        );

    background:
        linear-gradient(
            90deg,
            #a76c19,
            #e1b34f 35%,
            #fff0ae 55%,
            #b77a21
        );
}


/* ковзний відблиск */

.pen::after{
    content:"";

    position:absolute;

    left:8px;
    top:2px;

    width:55px;
    height:3px;

    border-radius:3px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,237,175,.92),
            transparent
        );

    animation:
        penGlow 5.5s
        ease-in-out
        infinite;
}


@keyframes penFloat{

    0%,100%{
        transform:
            translateY(0)
            rotate(-8deg);
    }

    50%{
        transform:
            translateY(-3px)
            rotate(-7.5deg);
    }
}


@keyframes penGlow{

    0%,40%{
        left:8px;
        opacity:0;
    }

    48%{
        opacity:.95;
    }

    65%{
        left:138px;
        opacity:.75;
    }

    78%,100%{
        left:138px;
        opacity:0;
    }
}


/* =========================================================
   ОСНОВНА РОБОЧА ЧАСТИНА
========================================================= */

.app{
    height:
        calc(
            100vh - 118px
        );

    display:grid;

    grid-template-columns:
        385px 1fr;

    overflow:hidden;
}


/* =========================================================
   ЛІВА ПАНЕЛЬ
========================================================= */

.panel{
    height:100%;

    overflow-y:auto;

    padding:
        17px 20px 30px;

    color:white;

    background:
        linear-gradient(
            180deg,
            #0a3459 0%,
            #0e4e7b 100%
        );

    border-right:
        1px solid
        rgba(255,255,255,.18);
}


.panel-title{
    margin:0;

    color:#efcf78;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:19px;
}


.panel-subtitle{
    margin-top:3px;
    margin-bottom:13px;

    font-size:11px;

    opacity:.72;
}


/* =========================================================
   ФОРМИ
========================================================= */

.field{
    margin-top:12px;
}


label{
    display:block;

    margin-bottom:6px;

    font-size:12.5px;

    font-weight:700;
}


textarea,
select,
input[type="file"]{
    width:100%;

    padding:9px 10px;

    border-radius:10px;

    border:
        1px solid
        rgba(255,255,255,.28);

    background:
        rgba(255,255,255,.11);

    color:white;

    outline:none;
}


textarea{
    min-height:75px;

    resize:vertical;

    font-size:14px;

    line-height:1.4;
}


select option{
    color:#10243a;
    background:#fff;
}


input[type="range"]{
    width:100%;
}


input[type="color"]{
    width:100%;

    height:38px;

    padding:0;

    border:0;

    background:transparent;
}


.two{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:9px;
}


.small{
    margin-top:5px;

    font-size:10.5px;

    line-height:1.4;

    opacity:.76;
}


.check{
    display:flex;

    align-items:center;

    gap:7px;

    margin-top:8px;

    font-size:11.5px;

    font-weight:600;
}


/* =========================================================
   КНОПКИ
========================================================= */

.button{
    width:100%;

    margin-top:9px;

    padding:10px 12px;

    border-radius:10px;

    font-size:12.5px;

    font-weight:800;

    cursor:pointer;
}


.button-main{
    color:#0a3559;

    border:
        1px solid #dfbb5a;

    background:
        linear-gradient(
            180deg,
            #fff8d8,
            #e9cf81
        );
}


.button-alt{
    color:white;

    border:
        1px solid
        rgba(255,255,255,.24);

    background:
        rgba(255,255,255,.08);
}


.text-tools{
    display:grid;

    grid-template-columns:

    gap:6px;

.mini-button{
    padding:7px 4px;

    border-radius:8px;

    border:
        1px solid
        rgba(235,202,116,.39);

    background:
        rgba(235,202,116,.08);

    color:#fff1c7;

    font-size:10.5px;

    font-weight:700;

    cursor:pointer;
}


/* =========================================================
   РОБОЧА ЗОНА
========================================================= */

.workspace{
    height:100%;

    overflow:auto;

    display:flex;

    align-items:flex-start;

    justify-content:center;

    padding:
        14px 18px 20px;

    background:#e9f3fa;
}


.canvas-wrap{
    width:
        min(
            1160px,
            100%
        );
}


canvas{
    width:100%;

    height:auto;

    display:block;

    background:white;

    border-radius:15px;

    border:
        1px solid

.help{
    margin-top:7px;

    color:#56748b;

    text-align:center;

    font-size:10.5px;

/* =========================================================
   МОБІЛЬНА ВЕРСІЯ
========================================================= */

@media(max-width:920px){

    body{
        overflow:auto;
    }

    .site-header{
        height:auto;

    }

    }

        height:auto;
        grid-template-columns:1fr;
        overflow:visible;
    }

    .panel{
        height:auto;
    }

    .workspace{
        height:auto;
    }
}

</style>
</head>

<script>

/* =========================================================
   ОСНОВА
========================================================= */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const $ =
id => document.getElementById(id);

let customFontCount = 0;


/* =========================================================
   ПАРАМЕТРИ ЗОШИТА
========================================================= */

const notebook = {

    slant:{
        marginX:145,
        firstBaseline:176,
        rowGap:146,
        letterHeight:66
    },

    wide:{
        marginX:145,
        firstBaseline:168,
        rowGap:112,
        letterHeight:76
    },

    grid:{
        marginX:145,
        firstBaseline:156,
        rowGap:104,
        letterHeight:70
    }

};


function isNotebookMode(){

    const mode =
    $("backgroundMode").value;

    return(
        mode === "slant"
        ||
        mode === "wide"
        ||
        mode === "grid"
    );
}


/* =========================================================
   ДОПОМІЖНА ЛІНІЯ
========================================================= */

function horizontalLine(y){

    ctx.beginPath();

    ctx.moveTo(
        0,
        y
    );

    ctx.lineTo(
        canvas.width,
        y
    );

    ctx.stroke();
}


/* =========================================================
   КОСА ЛІНІЯ
   наближена до справжнього шкільного зошита
========================================================= */

function drawSlantNotebook(){

    ctx.fillStyle =
    "#ffffff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.save();


    /* похилі напрямні */

    ctx.strokeStyle =
    "rgba(40,190,225,.42)";

    ctx.lineWidth =
    1.7;


    for(
        let x = -500;
        x < canvas.width + 500;
        x += 145
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            canvas.height
        );

        ctx.lineTo(
            x + 330,
            0
        );

        ctx.stroke();
    }


    const cfg =
    notebook.slant;


    /*
      У кожному рядку:
      верхня межа,
      дві тонші допоміжні,
      базова лінія.
    */

    for(
        let base =
            cfg.firstBaseline;
        base <
            canvas.height + cfg.rowGap;
        base += cfg.rowGap
    ){

        /* верхня */

        ctx.strokeStyle =
        "rgba(34,182,220,.55)";

        ctx.lineWidth =
        1.8;

        horizontalLine(
            base - 64
        );


        /* допоміжна 1 */

        ctx.strokeStyle =
        "rgba(34,182,220,.31)";

        ctx.lineWidth =
        1.25;

        horizontalLine(
            base - 43
        );


        /* допоміжна 2 */

        horizontalLine(
            base - 22
        );


        /* базова */

        ctx.strokeStyle =
        "rgba(34,182,220,.60)";

        ctx.lineWidth =
        1.8;

        horizontalLine(
            base
        );
    }


    /* рожеве поле */

    ctx.strokeStyle =
    "rgba(225,43,145,.82)";

    ctx.lineWidth =
    2.6;

    ctx.beginPath();

    ctx.moveTo(
        cfg.marginX,
        0
    );

    ctx.lineTo(
        cfg.marginX,
        canvas.height
    );

    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   ШИРОКА ЛІНІЯ
========================================================= */

function drawWideNotebook(){

    ctx.fillStyle =
    "#ffffff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const cfg =
    notebook.wide;


    ctx.save();


    ctx.strokeStyle =
    "rgba(61,143,198,.30)";

    ctx.lineWidth =
    1.8;


    for(
        let y =
            cfg.firstBaseline;
        y < canvas.height;
        y += cfg.rowGap
    ){

        horizontalLine(y);
    }


    ctx.strokeStyle =
    "rgba(225,43,145,.72)";

    ctx.lineWidth =
    2.6;

    ctx.beginPath();

    ctx.moveTo(
        cfg.marginX,
        0
    );

    ctx.lineTo(
        cfg.marginX,
        canvas.height
    );

    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   КЛІТИНКА
========================================================= */

function drawGridNotebook(){

    ctx.fillStyle =
    "#ffffff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.save();


    const cell =
    52;


    ctx.strokeStyle =
    "rgba(61,143,198,.23)";

    ctx.lineWidth =
    1.25;


    for(
        let x = 0;
        x <= canvas.width;
        x += cell
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            canvas.height
        );

        ctx.stroke();
    }


    for(
        let y = 0;
        y <= canvas.height;
        y += cell
    ){

        horizontalLine(y);
    }


    ctx.strokeStyle =
    "rgba(225,43,145,.72)";

    ctx.lineWidth =
    2.6;

    ctx.beginPath();

    ctx.moveTo(
        notebook.grid.marginX,
        0
    );

    ctx.lineTo(
        notebook.grid.marginX,
        canvas.height
    );

    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   ІНШІ ФОНИ
========================================================= */

function drawBackground(){

    const mode =
    $("backgroundMode").value;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if(
        mode === "slant"
    ){
        drawSlantNotebook();
        return;
    }


    if(
        mode === "wide"
    ){
        drawWideNotebook();
        return;
    }


    if(
        mode === "grid"
    ){
        drawGridNotebook();
        return;
    }


    if(
        mode === "white"
    ){

        ctx.fillStyle =
        "#ffffff";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        return;
    }


    if(
        mode === "navy"
    ){

        const g =
        ctx.createLinearGradient(
            0,
            0,
            canvas.width,
            canvas.height
        );

        g.addColorStop(
            0,
            "#061e35"
        );

        g.addColorStop(
            1,
            "#0d4a74"
        );

        ctx.fillStyle =
        g;

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        return;
    }


    if(
        mode === "contrastLight"
    ){

        ctx.fillStyle =
        "#f5faff";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        return;
    }


    if(
        mode === "contrastDark"
    ){

        ctx.fillStyle =
        "#082945";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        return;
    }
}


/* =========================================================
   РАМКА
========================================================= */

function drawFrame(){

    if(
        !$("frame").checked
    ){
        return;
    }


    ctx.save();

    ctx.strokeStyle =
    "rgba(194,147,56,.76)";

    ctx.lineWidth =
    3;

    ctx.strokeRect(
        52,
        52,
        canvas.width - 104,
        canvas.height - 104
    );

    ctx.restore();
}


/* =========================================================
   ТЕКСТ
========================================================= */

function getLines(){

    return(
        $("textInput").value
        ||
        "Люблю Україну!"
    )
    .split("\n");
}


function setCanvasFont(size){

    ctx.font =
    `${size}px "${$("fontSelect").value}"`;

    ctx.textBaseline =
    "alphabetic";
}


function metricsFor(
    text,
    size
){

    setCanvasFont(size);

    const m =
    ctx.measureText(
        text || " "
    );

    return{

        width:
            m.width,

        ascent:
            m.actualBoundingBoxAscent
            ||
            size * .80,

        descent:
            m.actualBoundingBoxDescent
            ||
            size * .22
    };
}


function widestLine(size){

    let widest = 0;


    for(
        const line of getLines()
    ){

        widest =
        Math.max(
            widest,
            metricsFor(
                line,
                size
            ).width
        );
    }


    return widest;
}


/* =========================================================
   АВТОМАТИЧНА ВИСОТА ПІД РЯДОК
========================================================= */

function notebookFontSize(){

    const mode =
    $("backgroundMode").value;

    const cfg =
    notebook[mode];


    if(!cfg){

        return Number(
            $("fontSize").value
        );
    }


    const indent =
    Number(
        $("leftIndent").value
    );


    const maxWidth =
        canvas.width
        -
        cfg.marginX
        -
        indent
        -
        80;


    let best =
    20;


    for(
        let size = 20;
        size <= 190;
        size += 2
    ){

        let tallest = 0;


        for(
            const line
            of getLines()
        ){

            const m =
            metricsFor(
                line,
                size
            );


            tallest =
            Math.max(
                tallest,
                m.ascent
                +
                m.descent
            );
        }


        const fitsHeight =
            tallest
            <=
            cfg.letterHeight;


        const fitsWidth =
            widestLine(size)
            <=
            maxWidth;


        if(
            fitsHeight
            &&
            fitsWidth
        ){

            best =
            size;
        }

        else{

            break;
        }
    }


    return best;
}


/* =========================================================
   КОЛІР
========================================================= */

function textFill(){

    const effect =
    $("textEffect").value;


    if(
        effect === "gold"
    ){

        const g =
        ctx.createLinearGradient(
            0,
            240,
            0,
            650
        );

        g.addColorStop(
            0,
            "#fff1b9"
        );

        g.addColorStop(
            .35,
            "#e9c366"
        );

        g.addColorStop(
            .68,
            "#aa711d"
        );

        g.addColorStop(
            1,
            "#f2d37c"
        );

        return g;
    }


    if(
        effect === "pearl"
    ){

        const g =
        ctx.createLinearGradient(
            0,
            250,
            0,
            650
        );

        g.addColorStop(
            0,
            "#ffffff"
        );

        g.addColorStop(
            .48,
            "#d7eeff"
        );

        g.addColorStop(
            1,
            "#ffffff"
        );

        return g;
    }


    return $("fontColor").value;
}


/* =========================================================
   ПОЗИЦІЯ В ЗОШИТІ
========================================================= */

function notebookX(){

    const mode =
    $("backgroundMode").value;

    const cfg =
    notebook[mode];

    const indent =
    Number(
        $("leftIndent").value
    );

    const align =
    $("alignment").value;


    if(
        align === "left"
    ){

        ctx.textAlign =
        "left";

        return(
            cfg.marginX
            +
            indent
        );
    }


    if(
        align === "right"
    ){

        ctx.textAlign =
        "right";

        return(
            canvas.width
            -
            60
            -
            indent
        );
    }


    ctx.textAlign =
    "center";

    return(
        canvas.width / 2
    );
}


/* =========================================================
   ЗОШИТОВИЙ ЗАПИС
========================================================= */

function drawNotebookText(){

    const mode =
    $("backgroundMode").value;

    const cfg =
    notebook[mode];


    let size =
    Number(
        $("fontSize").value
    );


    if(
        $("autoNotebookSize").checked
    ){

        size =
        notebookFontSize();

        $("fontSize").value =
        size;
    }


    setCanvasFont(size);


    ctx.fillStyle =
    textFill();


    if(
        $("shadow").checked
    ){

        ctx.shadowColor =
        "rgba(0,0,0,.15)";

        ctx.shadowBlur =
        7;

        ctx.shadowOffsetY =
        2;
    }


    const lines =
    getLines();


    const start =
        Number(
            $("startRow").value
        )
        -
        1;


    for(
        let i = 0;
        i < lines.length;
        i++
    ){

        const baseline =
            cfg.firstBaseline
            +
            (
                start + i
            )
            *
            cfg.rowGap;


        if(
            baseline
            >
            canvas.height - 20
        ){

            break;
        }


        const x =
        notebookX();


        ctx.fillText(
            lines[i],
            x,
            baseline
        );
    }
}


/* =========================================================
   ВІЛЬНИЙ РЕЖИМ
========================================================= */

function drawFreeText(){

    const size =
    Number(
        $("fontSize").value
    );


    setCanvasFont(size);


    const lines =
    getLines();


    const ratio =
        Number(
            $("lineHeight").value
        )
        /
        100;


    const step =
        size * ratio;


    const totalHeight =
        Math.max(
            0,
            lines.length - 1
        )
        *
        step;


    let x =
        canvas.width / 2;


    const align =
    $("alignment").value;


    if(
        align === "left"
    ){

        ctx.textAlign =
        "left";

        x =
            90
            +
            Number(
                $("leftIndent").value
            );
    }

    else if(
        align === "right"
    ){

        ctx.textAlign =
        "right";

        x =
            canvas.width
            -
            90
            -
            Number(
                $("leftIndent").value
            );
    }

    else{

        ctx.textAlign =
        "center";
    }


    ctx.fillStyle =
    textFill();


    if(
        $("shadow").checked
    ){

        ctx.shadowColor =
        "rgba(0,0,0,.20)";

        ctx.shadowBlur =
        11;

        ctx.shadowOffsetY =
        4;
    }


    let y =
        canvas.height / 2
        -
        totalHeight / 2;


    for(
        const line of lines
    ){

        ctx.fillText(
            line,
            x,
            y
        );

        y += step;
    }
}


/* =========================================================
   РЕНДЕР
========================================================= */

function drawText(){

    ctx.save();


    if(
        isNotebookMode()
        &&
        $("snapLines").checked
    ){

        drawNotebookText();
    }

    else{

        drawFreeText();
    }


    ctx.restore();
}


function render(){

    drawBackground();

    drawFrame();

    drawText();


    $("sizeValue").textContent =
        $("fontSize").value;


    $("lineValue").textContent =
        (
            Number(
                $("lineHeight").value
            )
            /
            100
        )
        .toFixed(2);


    $("indentValue").textContent =
        $("leftIndent").value;


    $("rowValue").textContent =
        $("startRow").value;
}


/* =========================================================
   АВТОВПИСУВАННЯ
========================================================= */

async function fitText(){

    await document.fonts.ready;


    if(
        isNotebookMode()
        &&
        $("snapLines").checked
    ){

        $("fontSize").value =
            notebookFontSize();

        render();

        return;
    }


    let size =
    240;


    while(
        size > 20
    ){

        if(
            widestLine(size)
            <=
            canvas.width * .82
        ){

            break;
        }


        size -= 2;
    }


    $("fontSize").value =
        size;


    render();
}


/* =========================================================
   ВЛАСНІ ШРИФТИ
========================================================= */

async function loadFont(file){

    try{

        const base =
            file.name
            .replace(
                /\.[^/.]+$/,
                ""
            )
            .replace(
                /["']/g,
                ""
            );


        let name =
            base;


        let number =
            2;


        while(
            [
                ...$("fontSelect").options
            ]
            .some(
                option =>
                    option.textContent
                    ===
                    name
            )
        ){

            name =
                `${base} ${number}`;

            number++;
        }


        const url =
            URL.createObjectURL(
                file
            );


        const face =
            new FontFace(
                name,
                `url("${url}")`
            );


        await face.load();


        document.fonts.add(
            face
        );


        const option =
            document.createElement(
                "option"
            );


        option.value =
            name;

        option.textContent =
            name;


        $("fontSelect")
        .appendChild(
            option
        );


        $("fontSelect").value =
            name;


        customFontCount++;


        $("fontCount").textContent =
            `Власних шрифтів: ${customFontCount}`;


        await document.fonts.ready;


        await fitText();
    }

    catch(error){

        console.error(error);

        alert(
            "Не вдалося відкрити шрифт: "
            +
            file.name
        );
    }
}


$("fontFiles")
.addEventListener(
    "change",
    async event =>{

        for(
            const file
            of event.target.files
        ){

            if(
                /\.(ttf|otf|woff|woff2)$/i
                .test(
                    file.name
                )
            ){

                await loadFont(
                    file
                );
            }
        }
    }
);


/* =========================================================
   РЕДАГУВАННЯ ВИДІЛЕНОГО СЛОВА
========================================================= */

function getSelection(){

    const textarea =
        $("textInput");


    const start =
        textarea.selectionStart;

    const end =
        textarea.selectionEnd;


    if(
        start === end
    ){

        alert(
            "Спочатку виділіть слово."
        );

        return null;
    }


    return{

        textarea,
        start,
        end,

        selected:
            textarea.value
            .slice(
                start,
                end
            )
    };
}


/* На початок поточного рядка */

$("moveStartButton")
.addEventListener(
    "click",
    ()=>{

        const info =
            getSelection();


        if(!info){
            return;
        }


        const word =
            info.selected.trim();


        let original =
            info.textarea.value;


        let before =
            original.slice(
                0,
                info.start
            );


        let after =
            original.slice(
                info.end
            );


        if(
            after.startsWith(" ")
        ){

            after =
                after.slice(1);
        }

        else if(
            before.endsWith(" ")
        ){

            before =
                before.slice(
                    0,
                    -1
                );
        }


        let text =
            before
            +
            after;


        let lineStart =
            text.lastIndexOf(
                "\n",
                Math.min(
                    info.start - 1,
                    text.length - 1
                )
            )
            +
            1;


        text =
            text.slice(
                0,
                lineStart
            )
            +
            word
            +
            " "
            +
            text.slice(
                lineStart
            );


        info.textarea.value =
            text;


        render();
    }
);


/* На новий рядок */

$("moveNewLineButton")
.addEventListener(
    "click",
    ()=>{

        const info =
            getSelection();


        if(!info){
            return;
        }


        const word =
            info.selected.trim();


        let before =
            info.textarea.value.slice(
                0,
                info.start
            );


        let after =
            info.textarea.value.slice(
                info.end
            );


        if(
            after.startsWith(" ")
        ){

            after =
                after.slice(1);
        }

        else if(
            before.endsWith(" ")
        ){

            before =
                before.slice(
                    0,
                    -1
                );
        }


        let text =
            before
            +
            after;


        let lineEnd =
            text.indexOf(
                "\n",
                info.start
            );


        if(
            lineEnd === -1
        ){

            lineEnd =
                text.length;
        }


        text =
            text.slice(
                0,
                lineEnd
            )
            +
            "\n"
            +
            word
            +
            text.slice(
                lineEnd
            );


        info.textarea.value =
            text;


        render();
    }
);


/* =========================================================
   ЗМІНА РОБОЧОЇ ПЛОЩИНИ
========================================================= */

async function applyMode(){

    if(
        isNotebookMode()
    ){

        $("alignment").value =
            "left";


        $("snapLines").checked =
            true;


        $("autoNotebookSize").checked =
            true;


        $("shadow").checked =
            false;


        $("lineHeight").disabled =
            true;


        $("lineHelp").textContent =
            "Авто за лініями зошита ✓";


        await fitText();
    }

    else{

        $("alignment").value =
            "center";


        $("lineHeight").disabled =
            false;


        $("lineHelp").textContent =
            "У вільному режимі інтервал змінюється вручну.";


        render();
    }
}
