<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Студія декоративного тексту</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  background:#dff1ff;
}

.app{
  min-height:100vh;
  display:grid;
  grid-template-columns:380px 1fr;
}

.panel{
  background:#103f68;
  color:white;
  padding:22px;
  overflow:auto;
}

h1{
  margin:0 0 6px;
  font-size:24px;
}

.version{
  font-size:12px;
  opacity:.8;
  margin-bottom:18px;
}

label{
  display:block;
  margin-top:14px;
  margin-bottom:6px;
  font-weight:700;
}

textarea,
select,
input[type=file]{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #7ba2c1;
}

textarea{
  min-height:100px;
}

input[type=range]{
  width:100%;
}

button{
  width:100%;
  margin-top:14px;
  padding:12px;
  border:0;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

.workspace{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

canvas{
  width:min(1200px,100%);
  height:auto;
  border-radius:24px;
  box-shadow:0 20px 45px rgba(0,0,0,.18);
}
</style>
</head>

<body>

<div class="app">

<aside class="panel">

<h1>Студія декоративного тексту</h1>
<div class="version">Тестова версія 4 — Canvas</div>

<label>Ваш текст</label>

<textarea id="text">
День
Державного прапора
України
</textarea>

<label>Шрифт</label>

<select id="font">
  <option value="Segoe UI">Segoe UI</option>
  <option value="Georgia">Georgia</option>
  <option value="Times New Roman">Times New Roman</option>
</select>

<div id="count" style="margin-top:6px;font-size:12px">
Власних шрифтів: 0
</div>

<label>Додати свій шрифт</label>

<input
  id="fontFile"
  type="file"
  accept=".ttf,.otf,.woff,.woff2"
  multiple
>

<label>
Розмір:
<span id="sizeText">110</span> px
</label>

<input
  id="size"
  type="range"
  min="30"
  max="240"
  value="110"
>

<label>
Міжрядковий інтервал:
<span id="lineText">1.15</span>
</label>

<input
  id="line"
  type="range"
  min="80"
  max="180"
  value="115"
>

<button id="fit">
Вписати текст автоматично
</button>

<button id="save">
Зберегти PNG
</button>

</aside>


<main class="workspace">

<canvas
  id="canvas"
  width="1600"
  height="900">
</canvas>

</main>

</div>


<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const textInput =
document.getElementById("text");

const fontSelect =
document.getElementById("font");

const sizeInput =
document.getElementById("size");

const lineInput =
document.getElementById("line");

const sizeText =
document.getElementById("sizeText");

const lineText =
document.getElementById("lineText");

const fontFile =
document.getElementById("fontFile");

const count =
document.getElementById("count");

let fontCount = 0;


/* -------------------------
   ФОН
-------------------------- */

function drawBackground(){

  const gradient =
  ctx.createLinearGradient(
    0,
    0,
    0,
    canvas.height
  );

  gradient.addColorStop(
    0,
    "#5fb5e7"
  );

  gradient.addColorStop(
    0.55,
    "#a9d8ef"
  );

  gradient.addColorStop(
    1,
    "#f2dfad"
  );

  ctx.fillStyle =
  gradient;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.strokeStyle =
  "rgba(255,255,255,.7)";

  ctx.lineWidth =
  3;

  ctx.strokeRect(
    90,
    70,
    1420,
    760
  );

}


/* -------------------------
   ТЕКСТ
-------------------------- */

function drawText(){

  const lines =
  textInput.value
  .trim()
  .split("\n");

  const size =
  Number(
    sizeInput.value
  );

  const lineHeight =
  Number(
    lineInput.value
  )
  /
  100;


  ctx.font =
  size +
  'px "' +
  fontSelect.value +
  '"';


  ctx.textAlign =
  "center";

  ctx.textBaseline =
  "middle";

  ctx.fillStyle =
  "#ffffff";

  ctx.shadowColor =
  "rgba(0,0,0,.25)";

  ctx.shadowBlur =
  12;

  ctx.shadowOffsetY =
  5;


  const step =
  size * lineHeight;


  const totalHeight =
  step *
  (
    lines.length - 1
  );


  let y =
  canvas.height / 2
  -
  totalHeight / 2;


  for(
    const line
    of lines
  ){

    ctx.fillText(
      line,
      canvas.width / 2,
      y
    );

    y += step;

  }

}


/* -------------------------
   ПЕРЕМАЛЮВАННЯ
-------------------------- */

function render(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawBackground();

  drawText();

  sizeText.textContent =
  sizeInput.value;

  lineText.textContent =
  (
    Number(
      lineInput.value
    )
    /
    100
  )
  .toFixed(2);

}


/* -------------------------
   АВТОМАТИЧНИЙ РОЗМІР
-------------------------- */

function fitText(){

  const lines =
  textInput.value
  .trim()
  .split("\n");


  let size =
  220;


  while(
    size > 30
  ){

    ctx.font =
    size +
    'px "' +
    fontSelect.value +
    '"';


    let widest =
    0;


    for(
      const line
      of lines
    ){

      widest =
      Math.max(
        widest,
        ctx.measureText(
          line
        ).width
      );

    }


    const lineHeight =
    Number(
      lineInput.value
    )
    /
    100;


    const height =
    size
    *
    lineHeight
    *
    lines.length;


    if(
      widest < 1250
      &&
      height < 560
    ){

      break;
    }


    size -= 2;

  }


  sizeInput.value =
  size;

  render();

}


/* -------------------------
   ЗАВАНТАЖЕННЯ ШРИФТУ
-------------------------- */

fontFile.addEventListener(
  "change",
  async function(){

    const files =
    Array.from(
      this.files
    );


    for(
      const file
      of files
    ){

      try{

        const name =
        file.name.replace(
          /\.[^.]+$/,
          ""
        );


        const url =
        URL.createObjectURL(
          file
        );


        const newFont =
        new FontFace(
          name,
          'url("' +
          url +
          '")'
        );


        await newFont.load();


        document.fonts.add(
          newFont
        );


        const option =
        document.createElement(
          "option"
        );


        option.value =
        name;

        option.textContent =
        name;


        fontSelect.appendChild(
          option
        );


        fontSelect.value =
        name;


        fontCount++;


        count.textContent =
        "Власних шрифтів: "
        +
        fontCount;


        await document.fonts.ready;


        fitText();

      }

      catch(error){

        console.error(
          error
        );

        alert(
          "Не вдалося завантажити "
          +
          file.name
        );

      }

    }

  }
);


/* -------------------------
   ПОДІЇ
-------------------------- */

textInput.addEventListener(
  "input",
  render
);

fontSelect.addEventListener(
  "change",
  render
);

sizeInput.addEventListener(
  "input",
  render
);

lineInput.addEventListener(
  "input",
  render
);


document
.getElementById("fit")
.addEventListener(
  "click",
  fitText
);


/* -------------------------
   PNG
-------------------------- */

document
.getElementById("save")
.addEventListener(
  "click",
  function(){

    render();


    const link =
    document.createElement(
      "a"
    );


    link.download =
    "dekoratyvnyi-tekst.png";


    link.href =
    canvas.toDataURL(
      "image/png"
    );


    link.click();

  }
);


/* -------------------------
   ПЕРШИЙ ЗАПУСК
-------------------------- */

render();

</script>

</body>
</html>
